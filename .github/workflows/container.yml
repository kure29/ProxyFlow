name: Container

on:
  push:
    branches:
      - autopilot/v1.0-rc
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npm run runtime:build
      - run: npm run test:deployment
      - run: docker compose config --quiet
        env:
          PROXYFLOW_RUNTIME_TOKEN: fictional-container-ci-token-123456789
          PROXYFLOW_DATA_DIR: /tmp/proxyflow-container-ci-data

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Verify release version and select channel
        shell: bash
        run: |
          set -Eeuo pipefail
          package_version="$(node -p 'require("./package.json").version')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_NAME}" != v* || "${tag_version}" != "${package_version}" ]]; then
            printf 'Tag %s does not match package version %s.\n' "${GITHUB_REF_NAME}" "${package_version}" >&2
            exit 1
          fi
          if [[ "${package_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            channel='rc'
          elif [[ "${package_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel='latest'
          else
            printf 'Unsupported release version: %s\n' "${package_version}" >&2
            exit 1
          fi
          printf 'version=%s\n' "${package_version}" >> "${GITHUB_OUTPUT}"
          printf 'channel=%s\n' "${channel}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kure29/proxyflow
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=${{ steps.release.outputs.channel }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

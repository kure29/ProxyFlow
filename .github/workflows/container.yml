name: Container

on:
  push:
    branches:
      - autopilot/v1.0-rc
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npm run runtime:build
      - run: npm run test:deployment
      - run: docker compose config --quiet
        env:
          PROXYFLOW_RUNTIME_TOKEN: fictional-container-ci-token-123456789
          PROXYFLOW_DATA_DIR: /tmp/proxyflow-container-ci-data

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: node -p '"value=" + require("./package.json").version' >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kure29/proxyflow:${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

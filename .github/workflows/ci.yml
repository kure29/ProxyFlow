name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npm run runtime:build
      - run: npm run test:deployment
      - run: npm run loon:acceptance
      - run: git diff --exit-code -- fixtures/loon/*.expected.conf
      - run: docker compose config --quiet
        env:
          PROXYFLOW_RUNTIME_TOKEN: fictional-ci-token-123456789
          PROXYFLOW_DATA_DIR: /tmp/proxyflow-ci-data

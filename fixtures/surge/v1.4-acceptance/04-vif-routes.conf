[General]
proxy-test-url = https://health.example.invalid/ping
ipv6 = true
ipv6-vif = auto
icmp-forwarding = false
tun-excluded-routes = 192.0.2.0/24, 198.51.100.0/24
tun-included-routes = 203.0.113.0/24

[Proxy]
VIF Fixture Proxy = socks5, vif-proxy.example.invalid, 1080, udp-relay=true

[Proxy Group]
VIF Auto = url-test, VIF Fixture Proxy, interval=300, tolerance=50

[Rule]
FINAL,VIF Auto

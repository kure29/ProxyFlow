[General]
encrypted-dns-server = https://1.1.1.1/dns-query

[Proxy]
HK Snapshot A = socks5, snapshot-a.example.invalid, 1080, username=fixture-snapshot, password=fixture-pass, udp-relay=true
HK Snapshot B = socks5, snapshot-b.example.invalid, 1081, username=fixture-snapshot, password=fixture-pass, udp-relay=true
Manual HTTPS Egress = https, manual.example.invalid, 8443, username=fixture-user, password=fixture-password, sni=manual.example.invalid
Fallback Egress = socks5, fallback.example.invalid, 1082, udp-relay=true

[Proxy Group]
Snapshot Auto = url-test, HK Snapshot A, HK Snapshot B, interval=300, tolerance=50
Manual Select = select, Manual HTTPS Egress, Fallback Egress
Fallback = fallback, Fallback Egress, Manual HTTPS Egress, interval=300
Manual Fixed = select, Manual HTTPS Egress
Release Chain = select, Manual HTTPS Egress, underlying-proxy=Snapshot Auto
Native Smart = smart, Manual HTTPS Egress, Fallback Egress
Native Subnet = subnet, default = Native Smart, SSID:Home-WiFi = DIRECT, TYPE:CELLULAR = Native Smart

[Rule]
RULE-SET,https://raw.githubusercontent.com/kure29/proxyflow-rules/main/rules/surge/OpenAI.list,Release Chain
DOMAIN-SUFFIX,example.org,Snapshot Auto
DOMAIN-SUFFIX,select.example.org,Manual Select
DOMAIN-SUFFIX,fallback.example.org,Fallback
DOMAIN-SUFFIX,subnet.example.org,Native Subnet
FINAL,Release Chain

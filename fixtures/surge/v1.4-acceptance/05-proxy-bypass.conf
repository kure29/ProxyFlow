[General]
proxy-test-url = https://health.example.invalid/ping
skip-proxy = example.com, *.example.org, localhost, 192.0.2.10, 192.0.2.*, 192.0.2.0/24
exclude-simple-hostnames = true

[Proxy]
Bypass Fixture Proxy = http, bypass-proxy.example.invalid, 8080

[Proxy Group]
Bypass Auto = url-test, Bypass Fixture Proxy, interval=300, tolerance=50

[Rule]
FINAL,Bypass Auto

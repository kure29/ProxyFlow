[General]
encrypted-dns-server = https://1.1.1.1/dns-query

[Proxy]
HK Snapshot A = socks5, snapshot-hk-a.example.invalid, 1080, username=snapshot, password=fixture-pass, udp-relay=true
HK Snapshot B = socks5, snapshot-hk-b.example.invalid, 1081, username=snapshot, password=fixture-pass, udp-relay=true
Manual HTTPS Egress = https, manual.example.invalid, 8443, username=release-user, password=release-password, sni=manual.example.invalid

[Proxy Group]
Snapshot Auto = url-test, HK Snapshot A, HK Snapshot B, interval=300, tolerance=50
Manual Fixed = select, Manual HTTPS Egress
Release Chain = select, Manual HTTPS Egress, underlying-proxy=Snapshot Auto

[Rule]
RULE-SET,https://raw.githubusercontent.com/kure29/proxyflow-rules/main/rules/surge/OpenAI.list,Release Chain
DOMAIN-SUFFIX,example.org,Snapshot Auto
FINAL,Release Chain
